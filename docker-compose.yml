name: shellmate
services:
  backend_app:
    build:
      context: .
      dockerfile: backend/app/Dockerfile
    container_name: backend_app
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/backend/data
      - ./logs:/app/logs
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8501}
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://backend_app:8000/api/v1
    depends_on:
      - backend_app
    networks:
      - app_network

  monitoring:
    build:
      context: ./monitoring_agent
      dockerfile: Dockerfile
    container_name: monitoring
    ports:
      - "8502:8502"
    environment:
      API_BASE_URL: http://backend_app:8000/api/v1
    depends_on:
      - backend_app
    networks:
      - app_network

  evaluation:
    profiles: ["evaluation"]
    build:
      context: .
    dockerfile: backend/app/Dockerfile
    command: ["python", "-m", "evals.run_evaluation"]
    env_file:
      - .env
    volumes:
      - ./evals:/app/evals
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
